{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ SITENAME }}{% endblock %}
{% block og_title %}{{ page.title }} — {{ SITENAME }}{% endblock %}

{% block content %}
<!-- Header -->
<section class="border-b border-line">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 py-20 md:py-24">
        <p class="eyebrow mb-6">{{ AUTHOR }}</p>
        <h1 class="display text-4xl md:text-6xl">{{ page.title }}</h1>
    </div>
</section>

<!-- Content -->
<article class="max-w-3xl mx-auto px-5 sm:px-8 py-16 md:py-20">
    <div class="prose max-w-none">
        {{ page.content }}
    </div>
</article>
{% endblock %}
